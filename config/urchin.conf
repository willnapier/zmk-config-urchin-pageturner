# Urchin right half as standalone BLE remote
# (no left half, no split peripheral role)

# Standalone: do not wait for a left half / split bond
CONFIG_ZMK_SPLIT=n

# Distinct BLE name so it does not collide with old "urchin" pairs
CONFIG_ZMK_KEYBOARD_NAME="Urchin-Turn"

# Three hosts: iPhone, nimbini, Mac. Not a split, so n not n+1.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# BLE range (same as Temper)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery: deep sleep after idle
CONFIG_ZMK_SLEEP=y
# 15 minutes — clicker spends most time idle
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# No display (no nice!view fitted)
CONFIG_ZMK_DISPLAY=n

# Host-select combos share E and I (two combos each)
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=4
