# Urchin right half as standalone Bluetooth page turner
# (no left half, no split peripheral role)

# Standalone: do not wait for a left half / split bond
CONFIG_ZMK_SPLIT=n

# Distinct BLE name so it does not collide with old "urchin" pairs
CONFIG_ZMK_KEYBOARD_NAME="Urchin-Turn"

# BLE range (same as Temper)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery: deep sleep after idle
CONFIG_ZMK_SLEEP=y
# 15 minutes — page turner spends most time idle
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Soft-off from a key (thumb) for long storage
CONFIG_ZMK_PM_SOFT_OFF=y

# No display on this firmware (lower power; works without nice!view)
CONFIG_ZMK_DISPLAY=n
