name: Build Urchin page-turner firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update

      - name: West Zephyr export
        run: west zephyr-export

      - name: Build Urchin right (page turner)
        run: >
          west build --pristine -s zmk/app -b nice_nano_v2 --
          -DSHIELD="urchin_right"
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename page-turner firmware
        run: cp build/zephyr/zmk.uf2 urchin_right_pageturner.uf2

      - name: Build settings_reset
        run: >
          west build --pristine -s zmk/app -b nice_nano_v2 --
          -DSHIELD="settings_reset"
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename settings_reset firmware
        run: cp build/zephyr/zmk.uf2 settings_reset.uf2

      - name: Archive firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            urchin_right_pageturner.uf2
            settings_reset.uf2
